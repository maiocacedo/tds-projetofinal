spring.application.name=nosso-teto-api-test
spring.datasource.url=jdbc:h2:mem:nossoteto_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.upload.dir=target/test-uploads
app.jwt.secret=NossoTetoTestSecretKeyForJwtGenerationNeedsToBeVeryLong256BitsAtLeast
app.jwt.expiration-ms=7200000
